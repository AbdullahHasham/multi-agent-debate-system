version: '3.8'

services:
  # The API Service (Back-end)
  backend:
    build: .
    container_name: debate_api
    # Internal port stays 8000 (standard for Uvicorn)
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"  # HOST:CONTAINER (Maps localhost:8003 -> internal:8000)
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

  # The Streamlit Service (Front-end)
  frontend:
    build: .
    container_name: debate_ui
    # Internal port stays 8501 (standard for Streamlit)
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8503:8501"  # HOST:CONTAINER (Maps localhost:8503 -> internal:8501)
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - backend